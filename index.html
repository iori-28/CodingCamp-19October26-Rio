<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Life Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">

        <!-- Greeting Section -->
        <section class="greeting-section">
            <div class="greeting-content">
                <div id="clock" class="greeting-clock">00:00:00</div>
                <div id="date" class="greeting-date">Loading...</div>
                <div id="greeting" class="greeting-text">Good Morning</div>
            </div>
        </section>

        <!-- Main Dashboard Grid -->
        <div class="dashboard">

            <!-- Focus Timer Card -->
            <section class="timer-section">
                <h2>Focus Timer</h2>

                <div class="timer-display">
                    <span id="timer">25:00</span>
                </div>

                <div class="timer-controls">
                    <button id="startBtn" class="btn btn-primary">Start</button>
                    <button id="stopBtn" class="btn btn-secondary">Stop</button>
                    <button id="resetBtn" class="btn btn-secondary">Reset</button>
                </div>

                <div class="timer-settings">
                    <label for="pomodoroTime">Pomodoro Duration (min):</label>
                    <input
                        type="number"
                        id="pomodoroTime"
                        min="1"
                        max="60"
                        value="25"
                        class="time-input"
                    >
                    <button id="applyTimeBtn" class="btn btn-small btn-primary">Apply</button>
                </div>
            </section>

            <!-- To-Do List Card -->
            <section class="todo-section">
                <h2>To-Do List</h2>

                <div class="todo-input-group">
                    <input
                        type="text"
                        id="todoInput"
                        placeholder="Add a new task..."
                        class="todo-input"
                    >
                    <button id="addTodoBtn" class="btn btn-primary">Add Task</button>
                </div>

                <div class="todo-sort">
                    <label for="sortSelect">Sort by:</label>
                    <select id="sortSelect" class="sort-select">
                        <option value="date-desc">Newest First</option>
                        <option value="date-asc">Oldest First</option>
                        <option value="status">Status (Active First)</option>
                        <option value="alphabetical">Alphabetical (A-Z)</option>
                    </select>
                </div>

                <ul id="todoList" class="todo-list"></ul>
            </section>

            <!-- Quick Links Card -->
            <section class="links-section">
                <h2>Quick Links</h2>

                <div class="quick-links-input">
                    <input
                        type="text"
                        id="linkName"
                        placeholder="Link name..."
                        class="link-input"
                    >
                    <input
                        type="url"
                        id="linkUrl"
                        placeholder="https://example.com"
                        class="link-input"
                    >
                    <button id="addLinkBtn" class="btn btn-primary">Add Link</button>
                </div>

                <div id="quickLinks" class="quick-links"></div>
            </section>

        </div><!-- /.dashboard -->
    </div><!-- /.container -->

    <script src="js/script.js"></script>
</body>
</html>
